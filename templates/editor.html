<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <link rel="stylesheet" href="../styles/editor/index.css">
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <h1>SelfBy</h1>
        </div>

        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="header-nav" id="headerNav">
            <button class="n-btn">Новая работа</button>
            <button class="b-btn" id="profileBtn">Profile</button>
        </nav>
    </header>

    <nav class="breadcrumbs" id="breadcrumbs"></nav>

    <div class="tips" id="tipsBlock" style="display: none; margin-top: 20px;">
        <div class="tips-header">
            <h3>Подсказка</h3>
            <button class="tips-close" onclick="closeTips()">Закрыть подсказки</button>
        </div>

        <div class="tip">
            <span class="tip-icon">🌿</span>
            <p>Это страница вашего проекта с работами. <span>Работы</span> - это файлы в формате Markdown, которые вы
                пишите</p>
        </div>

        <div class="tip">
            <span class="tip-icon">🧩</span>
            <p><span>Проект</span> является лишь входной точкой и соединителем всех работ</p>
        </div>
    </div>

    <main class="main">
        <div id="worksList"></div>
    </main>

    <div class="modal" id="newWorkModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Новая работа</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="Название работы" class="project-name-input" id="workTitle">
                <p id="work-slug">Введите название...</p>
            </div>
            <div class="modal-footer">
                <button class="create-btn l-btn" id="createWorkBtn">Создать</button>
            </div>
        </div>
    </div>

    <script src="../js/editor/index.js"></script>
    <script>const pageName = "editor";</script>
    <script src="../js/tips.js"></script>
    <script src="../js/breadcrumbs.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
