<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfBy</title>
    <link rel="stylesheet" href="../../../styles/public-work/index.css">
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <h1>SelfBy</h1>
        </div>

        <div class="header-nav">
            <a href="#" class="edit-btn" id="editBtn" style="display: none;">Редактировать</a>
            <button class="b-btn" id="profileBtn">Profile</button>
        </div>
    </header>

    <main class="main">
        <nav class="breadcrumbs">
            <a href="/u/" id="ownerLink" class="breadcrumb-link">
                <span id="ownerName">-</span>
            </a>
            <span class="breadcrumb-sep">/</span>
            <a href="#" id="projectLink" class="breadcrumb-link">
                <span id="projectName">-</span>
            </a>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="workTitle">-</span>
        </nav>

        <h1 class="work-title" id="workTitleMain">Загрузка...</h1>

        <div class="work-meta">
            <span class="work-views">
                👁 <span data-view-count id="workViews">0</span>
            </span>
            <div data-view data-element-type="work"></div>
            <span class="work-date" id="workDate">-</span>
            <button class="like-btn" data-like-btn data-element-type="work">
                <span data-like-icon>🤍</span>
                <span data-like-count>0</span>
            </button>
        </div>

        <div class="tips" id="tipsBlock" style="display: none;">
            <div class="tips-header">
                <h3>Подсказка</h3>
                <button class="tips-close" onclick="closeTips()">Закрыть подсказки</button>
            </div>

            <div class="tip">
                <span class="tip-icon">🧸</span>
                <p>Это работа пользователя. Тут может остуствовать контент, но если он есть, то это Markdown</p>
            </div>

            <div class="tip">
                <span class="tip-icon">💕</span>
                <p>Кроме контента тут есть статистика по просмотрам, лайки и дата выхода</p>
            </div>
        </div>

        <div class="work-content" id="workContent">

        </div>

        <div class="nav-footer">
            <button onclick="window.history.back()">Вернуться назад</button>
        </div>
    </main>

    <script src="../../../js/profile.js"></script>
    <script>const pageName = "public-works";</script>
    <script src="../../../js/tips.js"></script>
    <script src="../../../js/likes.js"></script>
    <script src="../../../js/views.js"></script>
    <script src="../../../js/public-work/index.js"></script>
</body>

</html>
