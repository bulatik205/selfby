<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfBy: Проект</title>
    <link rel="stylesheet" href="../../styles/public-project/index.css">
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <h1>SelfBy</h1>
        </div>

        <div class="header-nav">
            <button class="b-btn" id="profileBtn">Profile</button>
        </div>
    </header>

    <main class="main">
        <div class="project-header">
            <h1 class="project-title" id="projectTitle">Загрузка...</h1>
            <p class="project-description" id="projectDescription"></p>
        </div>

        <div class="project-meta">
            <!-- Хлебные крошки -->
            <nav class="breadcrumbs">
                <a href="/u/" id="ownerLink" class="breadcrumb-link">
                    <span id="ownerName">-</span>
                </a>
                <span class="breadcrumb-sep">/</span>
                <a href="#" id="projectLink" class="breadcrumb-link">
                    <span id="projectName">-</span>
                </a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-current" id="workTitle">-</span>
            </nav>

            <!-- Заголовок работы -->
            <h1 class="work-title" id="workTitleMain">Загрузка...</h1>

            <!-- Мета информация -->
            <div class="work-meta">
                <span class="work-views">👁 <span id="workViews">0</span></span>
                <span class="work-likes">❤ <span id="workLikes">0</span></span>
                <span class="work-date" id="workDate">-</span>
            </div>

            <!-- Контент работы -->
            <div class="work-content" id="workContent">
                <!-- HTML контент будет здесь -->
            </div>

            <!-- Кнопка назад -->
            <div class="nav-footer">
                <button onclick="window.history.back()">Вернуться назад</button>
            </div>
    </main>

    <script src="../../js/profile.js"></script>
    <script src="../../js/public-project/index.js"></script>
</body>

</html>
