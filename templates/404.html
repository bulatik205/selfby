<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfBy: Страница не найдена</title>
    <link rel="stylesheet" href="/styles/404/index.css">
</head>
<body>
    <main class="main">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <p class="error-text">Страница не найдена</p>
            <p class="error-hint">Возможно, она была удалена или вы ошиблись в адресе</p>
            
            <div class="error-actions">
                <a href="/" class="primary-btn">На главную</a>
                <a href="/dashboard" class="primary-btn">Дашборд</a>
                <button onclick="window.history.back()" class="secondary-btn">Вернуться назад</button>
            </div>
        </div>
    </main>
</body>
</html>
