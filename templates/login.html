<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="styles/auth/index.css">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="logo">SelfBy</div>
            <button class="b-btn" onclick="window.location.href='../'">На главную</button>
        </header>

        <main class="main">
            <div class="welcome-block">
                <h1 class="welcome-title">Вход</h1>
                <p class="welcome-text">
                    Войдите, чтобы получить доступ ко всем возможностям сайта
                </p>

                <div class="messages-row">
                    <div id="errorMessage" class="error-message" style="display: none;">
                        <span class="error-icon">⚠️</span>
                        <span id="errorText"></span>
                        <button class="error-close" onclick="hideError()">×</button>
                    </div>

                    <div id="timerBox" class="timer-box" style="display: none;">
                        <span id="timerCount">10</span>
                    </div>
                </div>

                <form class="auth-form" action="/auth/login" method="POST">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Введите ваш email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="l-btn submit-btn">Вход</button>
                        <button class="l-btn" onclick="window.location.href='../reg'">Регистрация</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/auth/index.js"></script>
</body>

</html>
